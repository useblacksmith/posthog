# Benchmark only. Compares two ways of running fewer frontend jest tests on a change:
#   baseline:   upstream's .github/scripts/jest-select.js + `jest --findRelatedTests` (static import graph)
#   blacksmith: @useblacksmith/jest (recorded runtime dependencies), shards sized from `jest --listTests` by upstream's rule
# Each commit on this branch is one upstream master commit plus this overlay;
# .bench/changed.txt holds the files that upstream commit changed.
# No secrets are referenced and the job token has no permissions.
name: jest-bench
on:
    push:
        branches: [jest-plugin-bench-segment]

permissions: {}

env:
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

jobs:
    bs-select:
        name: blacksmith select
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 10
        outputs:
            matrix: ${{ steps.plan.outputs.matrix }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            # The job runs with or without ee/, as upstream's FOSS and EE segments do; the same job id, so one record.
            - name: Remove ee
              if: ${{ hashFiles('.bench/foss') != '' }}
              run: rm -rf ee && echo "BENCH_SEGMENT FOSS"
            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/frontend... install --frozen-lockfile
            # Upstream's shard rule (.github/scripts/jest-select.js): one shard per 171 selected
            # test files, 8 at most, no job for none; 4 shards when the whole suite runs.
            - name: Plan shards from the affected test files
              id: plan
              working-directory: frontend
              env:
                  NODE_OPTIONS: --max-old-space-size=16384
                  BLACKSMITH_AFFECTED_JOB: blacksmith
              run: |
                  start=$(date +%s)
                  pnpm build:products >/dev/null
                  pattern='(frontend/|products/|common/|packages/quill/|packages/llm-normalizer/)'
                  affected=$(BLACKSMITH_JEST=1 pnpm exec jest --testPathPattern="$pattern" --listTests --json 2>/tmp/list.err | jq length)
                  grep -E 'blacksmith' /tmp/list.err | cut -c1-600 || true
                  total=$(grep -oE '[0-9]+ of [0-9]+ test file' /tmp/list.err | tail -1 | awk '{print $3}')
                  total=${total:-$affected}
                  if [ "$affected" -ge "$total" ]; then shards=4; else shards=$(( (affected + 170) / 171 )); [ "$shards" -gt 8 ] && shards=8; fi
                  echo "matrix=$(jq -nc --argjson n "$shards" '{include: [range(1; $n + 1) | {chunk: ., shard_count: $n}]}')" >> "$GITHUB_OUTPUT"
                  echo "BENCH_BS_SELECT total=$total affected=$affected shards=$shards seconds=$(( $(date +%s) - start ))"

    blacksmith:
        name: blacksmith jest (${{ matrix.chunk }})
        needs: bs-select
        if: ${{ needs.bs-select.outputs.matrix != '{"include":[]}' }}
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.bs-select.outputs.matrix) }}
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            # The job runs with or without ee/, as upstream's FOSS and EE segments do; the same job id, so one record.
            - name: Remove ee
              if: ${{ hashFiles('.bench/foss') != '' }}
              run: rm -rf ee && echo "BENCH_SEGMENT FOSS"
            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/frontend... install --frozen-lockfile
            - name: Test with Jest
              env:
                  NODE_OPTIONS: --max-old-space-size=16384
                  SHARD_INDEX: ${{ matrix.chunk }}
                  SHARD_COUNT: ${{ matrix.shard_count }}
                  BLACKSMITH_JEST: '1'
              run: |
                  set +e
                  start=$(date +%s)
                  pnpm --filter=@posthog/frontend test --maxWorkers=100% 2>&1 | tee /tmp/jest.log
                  code=${PIPESTATUS[0]}
                  echo "BENCH_RESULT arm=blacksmith shard=$SHARD_INDEX/$SHARD_COUNT exit=$code seconds=$(( $(date +%s) - start )) suites=[$(grep -E '^Test Suites:' /tmp/jest.log | tail -1)] plugin=[$(grep -E '^\[blacksmith\] [0-9]+ of [0-9]+ test file' /tmp/jest.log | cut -c1-200 | tail -1)]"
                  grep -E '^\[blacksmith\]' /tmp/jest.log | cut -c1-600
                  grep -E '^  run  ' /tmp/jest.log | sed -E 's/^  run  .*\((.*)\)$/\1/' | cut -c1-120 | sort | uniq -c | sort -rn | head -40
                  exit "$code"
