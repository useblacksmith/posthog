# Benchmark workflow for the posthog/posthog fork.
#
# Workload: the image build at the heart of upstream
# .github/workflows/container-images-cd.yml, job "posthog_build" (transcribed
# from upstream 2026-07-23 -- re-verify against the file at the pinned
# commit): the same Dockerfile, same context (.), same COMMIT_HASH build-arg.
#
# This is the one fork where the full upstream job CANNOT run outside the
# upstream org, because it is a deploy job (DECISIONS.md #7):
#   - upstream builds on Depot's remote build farm (depot/build-push-action
#     + paid Depot project) -- using it here would benchmark Depot's
#     machines, not the runner under test, so the build runs on the runner
#     via buildx instead
#   - registry logins + push to DockerHub/ghcr/ECR and the ECR tag
#     reconciliation need PostHog's secrets and serve deploys, not builds
#     (push: false here)
#   - upstream builds linux/arm64 alongside amd64; on x86 runners that arm
#     half executes under QEMU emulation and would measure QEMU, not the
#     runner (amd64 only here)
#   - the sourcemap-upload build secret is satisfied with a placeholder so
#     the same Dockerfile RUN --mount=type=secret lines execute
#
# Docker layer caching is where "warm" differs per environment
# (DECISIONS.md #4): buildx gha cache backend on GitHub-hosted,
# useblacksmith/build-push-action (sticky-disk builder) on Blacksmith.
#
# See forks/vite/benchmark.yml for the conventions shared by all forks
# (runs-on mapping, "workload:" step-name prefix, cold/warm semantics).

name: benchmark
run-name: "bench ${{ inputs.environment }} ${{ inputs.cache_state }} ${{ inputs.batch_id }} ${{ inputs.run_key }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Runner environment under test
        type: choice
        required: true
        options: [github, github-8core, ec2, blacksmith, blacksmith-4vcpu]
      cache_state:
        description: cold = no caches, warm = environment-native docker layer cache
        type: choice
        required: true
        options: [cold, warm]
      batch_id:
        description: Collection batch this run belongs to
        type: string
        required: true
      run_key:
        description: Unique key set by the orchestrator to find this run via the API
        type: string
        required: true

permissions:
  contents: read
  actions: write # gha buildx cache backend needs cache write access

jobs:
  benchmark:
    runs-on: ${{ fromJSON('{"github":"ubuntu-latest","github-8core":"benchmark-8core","ec2":"benchmark-ec2","blacksmith":"blacksmith-8vcpu-ubuntu-2404","blacksmith-4vcpu":"blacksmith-4vcpu-ubuntu-2404"}')[inputs.environment] }}
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # upstream value

      - name: Start telemetry
        uses: ./.github/actions/telemetry/start
        continue-on-error: true
        with:
          runner_label: ${{ inputs.environment }}

      - name: Set up Docker Buildx
        if: ${{ !startsWith(inputs.environment, 'blacksmith') }}
        uses: docker/setup-buildx-action@v4

      # --- workload: one docker build step per (environment, cache_state) ---
      # Exactly one of the four steps below runs; all use the same
      # Dockerfile, context, build-args, and secret mount as upstream's
      # depot/build-push-action invocation, differing only in cache
      # transport and push:false.

      - name: "workload: Build container image (cold, GitHub-hosted)"
        if: inputs.cache_state == 'cold' && !startsWith(inputs.environment, 'blacksmith')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          no-cache: true
          tags: posthog-bench:local
          platforms: linux/amd64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          secrets: |
            posthog_upload_sourcemaps_cli_api_key=benchmark-placeholder

      - name: "workload: Build container image (warm, GitHub-hosted)"
        if: inputs.cache_state == 'warm' && !startsWith(inputs.environment, 'blacksmith')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: posthog-bench:local
          platforms: linux/amd64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          secrets: |
            posthog_upload_sourcemaps_cli_api_key=benchmark-placeholder
          cache-from: type=gha,scope=benchmark
          cache-to: type=gha,scope=benchmark,mode=max

      # useblacksmith/build-push-action provisions a sticky-disk-backed
      # buildx builder; no setup-buildx step is needed on Blacksmith.
      - name: "workload: Build container image (cold, Blacksmith)"
        if: inputs.cache_state == 'cold' && startsWith(inputs.environment, 'blacksmith')
        uses: useblacksmith/build-push-action@v1
        with:
          context: .
          push: false
          no-cache: true
          tags: posthog-bench:local
          platforms: linux/amd64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          secrets: |
            posthog_upload_sourcemaps_cli_api_key=benchmark-placeholder

      - name: "workload: Build container image (warm, Blacksmith)"
        if: inputs.cache_state == 'warm' && startsWith(inputs.environment, 'blacksmith')
        uses: useblacksmith/build-push-action@v1
        with:
          context: .
          push: false
          tags: posthog-bench:local
          platforms: linux/amd64
          build-args: |
            COMMIT_HASH=${{ github.sha }}
          secrets: |
            posthog_upload_sourcemaps_cli_api_key=benchmark-placeholder

      - name: Stop telemetry
        if: always()
        uses: ./.github/actions/telemetry/stop
