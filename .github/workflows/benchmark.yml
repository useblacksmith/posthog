# Benchmark workflow for the posthog/posthog fork.
#
# Workload derived from upstream .github/workflows/container-images-cd.yml
# (production image build of the root Dockerfile), simplified to a single
# linear amd64 build with push disabled: no registry login, no tag/label
# metadata, no deploy notifications. See DECISIONS.md #7.
#
# Docker layer caching is where "warm" differs most per environment
# (DECISIONS.md #4):
#   - GitHub-hosted: buildx with the GitHub Actions cache backend
#     (cache-from/to type=gha, mode=max)
#   - Blacksmith: useblacksmith/build-push-action, which backs the buildx
#     instance with a sticky disk so layers persist between runs
#   - cold on both: no-cache build, no cache export
#
# See forks/vite/benchmark.yml for the conventions shared by all forks
# (runs-on mapping, "workload:" step-name prefix, cold/warm semantics).

name: benchmark
run-name: "bench ${{ inputs.environment }} ${{ inputs.cache_state }} ${{ inputs.batch_id }} ${{ inputs.run_key }}"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Runner environment under test
        type: choice
        required: true
        options: [github, github-8core, ec2, blacksmith]
      cache_state:
        description: cold = no caches, warm = environment-native caches
        type: choice
        required: true
        options: [cold, warm]
      batch_id:
        description: Collection batch this run belongs to
        type: string
        required: true
      run_key:
        description: Unique key set by the orchestrator to find this run via the API
        type: string
        required: true

permissions:
  contents: read
  actions: write # gha buildx cache backend needs cache write access

jobs:
  benchmark:
    runs-on: ${{ fromJSON('{"github":"ubuntu-latest","github-8core":"benchmark-8core","ec2":"benchmark-ec2","blacksmith":"blacksmith-8vcpu-ubuntu-2404"}')[inputs.environment] }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Start telemetry
        uses: ./.github/actions/telemetry/start
        continue-on-error: true
        with:
          runner_label: ${{ inputs.environment }}

      - name: Set up buildx (GitHub-hosted)
        if: inputs.environment != 'blacksmith'
        uses: docker/setup-buildx-action@v3

      # --- workload: one docker build step per (environment, cache_state) ---
      # Exactly one of the four steps below runs. All build the same
      # Dockerfile with push disabled; they differ only in cache transport.

      - name: "workload: docker build (cold, GitHub-hosted)"
        if: inputs.cache_state == 'cold' && inputs.environment != 'blacksmith'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: posthog-bench:local

      - name: "workload: docker build (warm, GitHub-hosted)"
        if: inputs.cache_state == 'warm' && inputs.environment != 'blacksmith'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: posthog-bench:local
          cache-from: type=gha,scope=benchmark
          cache-to: type=gha,scope=benchmark,mode=max

      # useblacksmith/build-push-action provisions a sticky-disk-backed
      # buildx builder; no setup-buildx step is needed on Blacksmith.
      - name: "workload: docker build (cold, Blacksmith)"
        if: inputs.cache_state == 'cold' && inputs.environment == 'blacksmith'
        uses: useblacksmith/build-push-action@v1
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          no-cache: true
          tags: posthog-bench:local

      - name: "workload: docker build (warm, Blacksmith)"
        if: inputs.cache_state == 'warm' && inputs.environment == 'blacksmith'
        uses: useblacksmith/build-push-action@v1
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: posthog-bench:local

      - name: Stop telemetry
        if: always()
        uses: ./.github/actions/telemetry/stop
