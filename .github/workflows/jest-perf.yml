name: jest-perf
on:
    push:
        branches: [jest-plugin-bench-perf]

permissions: {}

env:
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

jobs:
    run:
        name: paired jest (${{ matrix.chunk }}) ${{ matrix.order }} rep ${{ matrix.rep }}
        runs-on: blacksmith-4vcpu-ubuntu-2404
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                order: [ac, ca]
                chunk: [1, 2, 3, 4]
                rep: [1, 2, 3]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false
            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/frontend... install --frozen-lockfile
            - name: Paired runs
              env:
                  NODE_OPTIONS: --max-old-space-size=16384
                  SHARD_INDEX: ${{ matrix.chunk }}
                  SHARD_COUNT: 4
                  ORDER: ${{ matrix.order }}
                  REP: ${{ matrix.rep }}
              run: |
                  set +e
                  cache=$(cd frontend && BLACKSMITH_JEST=0 pnpm exec jest --showConfig 2>/dev/null | grep -m1 '"cacheDirectory"' | cut -d'"' -f4)
                  echo "jest cache: $cache"
                  dist=$(readlink -f frontend/node_modules/@useblacksmith/jest)/dist
                  for round in 1; do
                    for arm in $(echo "$ORDER" | grep -o .); do
                      [ -n "$cache" ] && rm -rf "$cache"
                      rm -rf frontend/node_modules/.cache/blacksmith-jest
                      export BLACKSMITH_JEST=$([ "$arm" = a ] && echo 0 || echo 1)
                      if [ "$arm" != a ]; then rm -rf "$dist"; tar xzf .bench/dist-$([ "$arm" = b ] && echo 010 || echo fix).tgz -C "$(dirname "$dist")"; fi
                      export BS_KEY="perf-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ORDER-$REP-$round-$arm"
                      t0=$(head -1 /proc/stat)
                      start=$(date +%s.%N)
                      pnpm --filter=@posthog/frontend test --maxWorkers=100% > /tmp/jest.log 2>&1
                      code=$?
                      end=$(date +%s.%N)
                      grep -E '^\[blacksmith\]' /tmp/jest.log | cut -c1-240
                      echo "PAIR arm=$arm shard=$SHARD_INDEX order=$ORDER rep=$REP round=$round exit=$code wall=$(echo "$end - $start" | bc) jest=[$(grep -E '^Time:' /tmp/jest.log | tail -1)] suites=[$(grep -E '^Test Suites:' /tmp/jest.log | tail -1)] stat0=[$t0] stat1=[$(head -1 /proc/stat)]"
                      [ "$code" != 0 ] && grep -E '^FAIL' /tmp/jest.log | head -5
                    done
                  done
                  exit 0
